<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5d57"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>Chamada UBS</title>
<style>
:root{--g:#0b5d57;--bg:#eef3f1;--c:#fff;--t:#14302c;--m:#5b7570;--ok:#2e9e5b;--no:#d33b3b;--wn:#e8b923;--l:#d5e0dd}
@media(prefers-color-scheme:dark){:root{--bg:#0d1917;--c:#15272a;--t:#e5f1ee;--m:#93aaa5;--l:#2a403f}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 "Trebuchet MS",Verdana,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:760px;margin:0 auto;padding:16px}h1{font:700 26px Georgia,serif;margin:8px 0 4px}h2{font:700 19px Georgia,serif;margin:18px 0 8px}small{color:var(--m);display:block}
.home{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;animation:f 1.1s ease both}@keyframes f{from{opacity:0}}
.big{font:700 20px Georgia,serif;padding:28px 18px;border-radius:6px;border:0;background:var(--g);color:#fff;text-align:left;cursor:pointer}.big+.big{background:var(--c);color:var(--g);border:2px solid var(--g)}
.card{background:var(--c);border:1px solid var(--l);border-radius:6px;padding:12px;margin:8px 0}.pr{border-left:8px solid var(--l)}.pr.ok{border-left-color:var(--ok);background:#2e9e5b22}.pr.wn{border-left-color:var(--wn);background:#e8b92330}
.bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}button{font:inherit;border-radius:6px;border:1px solid var(--g);background:var(--c);color:var(--g);padding:8px 12px;cursor:pointer}button.p{background:var(--g);color:#fff}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.no{background:var(--no);color:#fff;border-color:var(--no)}button.wn{background:var(--wn);color:#222;border-color:var(--wn)}
input,select,textarea{font:inherit;width:100%;padding:9px;margin:4px 0;border:1px solid var(--l);border-radius:6px;background:var(--c);color:var(--t)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button.on{background:var(--g);color:#fff}.opt{padding:8px;border-bottom:1px solid var(--l);cursor:pointer}.res{max-height:220px;overflow:auto;background:var(--c);border-radius:6px}.chip{display:inline-block;background:var(--l);border-radius:12px;padding:2px 10px;margin:2px;cursor:pointer}
#md{position:fixed;inset:0;background:#000a;display:none;overflow:auto;padding:12px}#md>div{max-width:620px;margin:0 auto;background:var(--bg);border-radius:8px;padding:14px}a{color:var(--g)}
</style></head><body><div class="w" id="app"></div><div id="md"><div id="mc"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
// ===== CONFIGURE (veja README no Code.gs) =====
const U='COLE_AQUI_A_URL_DO_APPS_SCRIPT',FB={apiKey:'',projectId:'',messagingSenderId:'',appId:''},VAPID='';
const IT=['Receituário Simples','Receituário Controle Especial','Receituário B (Azul)','Receituário A (Amarela)','SADT','SADT Laboratório','Ficha de Atendimento','Atestado'];
const DB={},RES={},F={cid:'cid10',ciap:'ciap2',sig:'sigtap'},nz=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const dados=async k=>DB[k]||(DB[k]=(await(await fetch('dados/'+F[k]+'.json')).json()).map(x=>[x[0],x[1],nz(x[0]+' '+x[1])]));
const pkb=(k,l)=>`<label>${l}<input oninput="busca('${k}',this)" placeholder="Código ou parte do nome"></label><div class=res id=r_${k}></div><div id=c_${k}></div>`;
async function busca(k,i){const q=nz(i.value.trim()),r=$('#r_'+k);if(q.length<2){r.innerHTML='';return}const w=q.split(/\s+/),a=(await dados(k)).filter(x=>w.every(s=>x[2].includes(s))).sort((x,y)=>nz(y[0]).startsWith(q)-nz(x[0]).startsWith(q));RES[k]=a.slice(0,25);r.innerHTML=RES[k].map((x,j)=>`<div class=opt onclick="addp('${k}',${j})"><b>${e(x[0])}</b> ${e(x[1])}</div>`).join('')||'<small>Nada encontrado.</small>'}
function addp(k,j){const x=RES[k][j],v=x[0]+' – '+x[1];if(!S.pk[k].includes(v))S.pk[k].push(v);$('#r_'+k).innerHTML='';$('#r_'+k).previousElementSibling.querySelector('input').value='';chips(k)}
const chips=k=>$('#c_'+k).innerHTML=S.pk[k].map((c,i)=>`<span class=chip onclick="S.pk['${k}'].splice(${i},1);chips('${k}')">${e(c)} ✕</span>`).join('');
const S={v:'home',tab:'hoje',tok:localStorage.tok||'',me:JSON.parse(localStorage.me||'null'),rp:localStorage.rp||'',d:{pac:[],staff:[],est:{},ret:{}},q:'',sel:'',dt:'',pk:{cid:[],ciap:[],sig:[]}};
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=()=>new Date().toLocaleDateString('sv'),agora=()=>new Date().toTimeString().slice(0,5);
const ord=a=>[...a].sort((x,y)=>(/^(Débora|Heuller)$/.test(x.n)-/^(Débora|Heuller)$/.test(y.n))||x.n.localeCompare(y.n,'pt'));
const adm=()=>S.me&&S.me.k=='g',ver=()=>S.me&&S.me.k!='m';
async function api(a,d={}){try{const r=await(await fetch(U,{method:'POST',body:JSON.stringify({a,t:S.tok,rp:S.rp,...d})})).json();if(r.err){if(r.err=='rp'){const p=prompt('Senha da recepção');if(p){S.rp=localStorage.rp=p;return api(a,d)}}else alert(r.err);return null}return r}catch(x){alert('Sem conexão com o servidor.');return null}}
async function load(){const r=await api('list');if(r){S.d=r;paint()}}
const act=async(a,d)=>{if(await api(a,d))load()};
function go(v){S.v=v;S.tab='hoje';S.sel='';paint(1);load()}
function sair(){S.tok=S.me=null;localStorage.removeItem('tok');localStorage.removeItem('me');go('home')}
const ST={'':'Aguardando',chegou:'Chegou',faltou:'Faltou',atraso:'Falta por atraso',tarde:'Chegou atrasado'};
function btns(p,rec){let b='';const i=`'${p.id}'`;
 if(rec){if(!p.st)b=`<button class=ok onclick="act('st',{id:${i},v:'chegou'})">Chegou</button><button class=no onclick="act('st',{id:${i},v:'faltou'})">Faltou</button>`;
  else if(p.st=='atraso')b=`<button class=wn onclick="act('st',{id:${i},v:'chegou'})">Chegou atrasado</button>`;
  else if(p.st=='tarde'&&!p.perg)b=`<button class=wn onclick="act('ask',{id:${i}})">Perguntar ao médico</button>`}
 else{if((p.st=='chegou'||p.st=='tarde')&&p.resp!='nao'){if(p.st=='tarde'&&!p.resp)b+=`<button class=ok onclick="act('resp',{id:${i},v:'sim'})">Atender mesmo assim</button><button class=no onclick="act('resp',{id:${i},v:'nao'})">Não atender</button>`;
  else b+=`<button onclick="prod(${i})">Produtividade</button><button class=ok onclick="act('fim',{id:${i},v:'ok'})">Terminar atendimento</button>`}}
 return b}
function row(p,rec){const m=S.d.staff.find(s=>s.id==p.med),c=p.fim=='ok'?'ok':p.fim=='dep'?'wn':'';
 return `<div class="card pr ${c}"><b>${e(p.hora)} · ${e(p.nome)}</b><small>${e(m&&m.n)}${p.pr?' · pront. '+e(p.pr):''}${p.urg?' · urgência':''} · ${ST[p.st||'']}${p.tC?' às '+p.tC:''}${p.tF?' às '+p.tF:''}${p.perg?' · perguntado ao médico':''}${p.resp?' · médico '+(p.resp=='sim'?'vai atender':'não vai atender'):''}</small><div class=bt>${btns(p,rec)}</div></div>`}
const meds=()=>ord(S.d.staff.filter(s=>s.k=='m'));
function addForm(){return `<div class=card><h2>Novo paciente</h2><input id=nn placeholder="Nome do paciente"><div class=g2><select id=nm>${meds().map(s=>`<option value=${s.id}>${e(s.n)} (${e(s.r)})</option>`).join('')}</select><input id=nh type=time></div><div class=bt><button class=p onclick="add('')">Adicionar</button><button class=ok onclick="add('chegou')">Chegou</button><button class=no onclick="add('faltou')">Faltou</button></div></div><div class=card><h2>Lista em papel</h2><small>Tire uma foto reta da folha (até 2 folhas por médico).</small><input type=file accept="image/*" multiple onchange="lista_foto(this)"></div>`}
async function add(v){const nome=$('#nn').value.trim(),hora=$('#nh').value;if(!nome||!hora)return alert('Informe nome e horário.');if(await api('add',{nome,med:$('#nm').value,hora,v}))load()}
function lista(rec,arr){const q=S.q.toLowerCase();arr=arr.filter(p=>!q||(p.nome+(S.d.staff.find(s=>s.id==p.med)||{}).n).toLowerCase().includes(q)).sort((a,b)=>a.hora.localeCompare(b.hora));return `<input placeholder="Buscar por paciente ou médico" value="${e(S.q)}" oninput="S.q=this.value;paint(1)">`+(arr.map(p=>row(p,rec)).join('')||'<small>Nenhum paciente hoje.</small>')}
function paint(f){if(!f&&document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;const h=hoje(),P=S.d.pac,v=S.v;let x='';
 if(v=='home')x=`<div class=home><div><h1>Chamada UBS</h1><small>Recepção e consultórios conectados</small></div><button class=big onclick="go('rec')">Recepção</button><button class=big onclick="go('st')">Médicos / Dentistas / Psicólogos / Gerência</button><div id=ins></div></div>`;
 if(v=='rec')x=`<button onclick="go('home')">Voltar</button><h1>Recepção</h1>${addForm()}<h2>Lista do dia</h2>${lista(1,P.filter(p=>p.dia==h))}`;
 if(v=='st'){if(S.me)return go('doc');x=`<button onclick="go('home')">Voltar</button><h1>Quem é você?</h1>${ord(S.d.staff).map(s=>`<button class="big" style="width:100%;margin:5px 0;padding:14px;font:600 17px Trebuchet MS" onclick="entrar('${s.id}')">${e(s.n)} <small style="color:inherit;opacity:.8">${e(s.r)}</small></button>`).join('')}<button onclick="novoPrest()">Adicionar prestador de serviço</button>`}
 if(v=='doc')x=doc();$('#app').innerHTML=x;if(v=='home')ins()}
function doc(){const m=S.me,h=hoje(),P=S.d.pac,id=S.sel||m.id,o=ver()?`<select onchange="S.sel=this.value;paint(1)">${meds().map(s=>`<option value=${s.id} ${s.id==id?'selected':''}>${e(s.n)}</option>`).join('')}</select>`:'',mine=P.filter(p=>p.med==id);
 let t=`<div class=tabs>${['hoje','historico','blocos'].concat(ver()?['prod']:[]).concat(adm()?['gerencia']:[]).map(k=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';paint(1)">${{hoje:'Hoje',historico:'Histórico',blocos:'Blocos',prod:'Produtividade',gerencia:'Gerência'}[k]}</button>`).join('')}</div>`,c='';
 if(S.tab=='hoje')c=(adm()?addForm():'')+lista(0,mine.filter(p=>p.dia==h));
 if(S.tab=='historico')c=Object.entries(mine.filter(p=>p.dia<h).reduce((a,p)=>((a[p.dia]=a[p.dia]||[]).push(p),a),{})).sort().reverse().map(([d,a])=>`<h2>${d}</h2>${a.map(p=>row(p,0)).join('')}`).join('')||'<small>Sem agenda anterior.</small>';
 if(S.tab=='blocos')c=`<small>Informe o que você pegou.</small>`+IT.map(i=>`<div class=card><b>${i}</b><small>Em estoque: ${(S.d.est[i]||0)-(S.d.ret[i]||0)}</small><div class=bt><input type=number min=1 id="r${IT.indexOf(i)}" value=1 style="width:80px"><button class=p onclick="act('bloco',{item:'${i}',qtd:+$('#r${IT.indexOf(i)}').value})">Peguei</button></div></div>`).join('');
 if(S.tab=='prod')c=meds().map(s=>{const a=P.filter(p=>p.med==s.id&&p.dia==h);return `<div class=card><b>${e(s.n)}</b><small>${a.length} agendados · ${a.filter(p=>p.fim=='ok').length} terminados · ${a.filter(p=>p.fim=='dep').length} a preencher · ${a.filter(p=>p.st=='faltou'||p.st=='atraso').length} faltas</small></div>`}).join('');
 if(S.tab=='gerencia')c=`<h2>Estoque (blocos)</h2>`+IT.map((i,k)=>`<div class=card><b>${i}</b><small>Tem ${S.d.est[i]||0} · retirados ${S.d.ret[i]||0} · restam ${(S.d.est[i]||0)-(S.d.ret[i]||0)}</small><div class=bt><input type=number id=e${k} value="${S.d.est[i]||0}" style="width:90px"><button class=p onclick="act('estoque',{item:'${i}',qtd:+$('#e${k}').value})">Salvar</button></div></div>`).join('')+`<h2>Senhas</h2>`+ord(S.d.staff).map(s=>`<div class=card>${e(s.n)} <button onclick="if(confirm('Resetar senha de ${e(s.n)}?'))act('reset',{id:'${s.id}'})">Resetar senha</button></div>`).join('')+`<button onclick="novoPrest()">Adicionar prestador de serviço</button>`;
 return `<h1>${e(m.n)}</h1><small>${e(m.r)}</small><div class=bt><button onclick="pushOn()">Ativar notificações</button><button onclick="sair()">Sair</button></div>${o}${t}${c}`}
async function entrar(id){const s=prompt('Senha');if(s===null)return;let r=await api('login',{id,s});if(!r)return;if(r.setup){const a=prompt('Primeiro acesso: crie uma senha (mín. 4 caracteres)');if(!a)return;r=await api('setpass',{id,s:a});if(!r)return}S.tok=localStorage.tok=r.tok;S.me=r.me;localStorage.me=JSON.stringify(r.me);go('doc')}
async function novoPrest(){const sp=prompt('Senha de prestador de serviço');if(!sp)return;const n=prompt('Nome');if(!n)return;const r=prompt('Função: Médico, Enfermeiro, Dentista, Psicólogo, Gerente ou Produtividade');if(!r)return;if(await api('prest',{sp,n,r}))load()}
function prod(id){const p=S.d.pac.find(x=>x.id==id),o=p.prod||{};S.pk={cid:o.cid||[],ciap:[].concat(o.ciap||[]),sig:[].concat(o.sig||[])};const f=(k,l,t='text')=>`<label>${l}<input id=f_${k} type=${t} value="${e(o[k])}" oninput="imc()"></label>`;
 $('#mc').innerHTML=`<h2>Produtividade · ${e(p.nome)}</h2><label>Vacinação<input id=f_vac value="${e(o.vac)}"></label><label>Amamentação<select id=f_am><option value="">—<option ${o.am=='Exclusiva'?'selected':''}>Exclusiva<option ${o.am=='Mista'?'selected':''}>Mista</select></label><div class=g2>${f('pc','PC (cm)','number')}${f('peso','Peso (kg)','number')}${f('alt','Altura (cm)','number')}<label>IMC<input id=f_imc readonly value="${e(o.imc)}"></label>${f('pa','Pressão arterial')}${f('ig','Idade gestacional')}${f('gp','Gravidez planejada')}${f('pt','Partos anteriores','number')}</div>
 ${pkb('cid','CID-10 (código ou nome da doença)')}${pkb('ciap','CIAP2')}${pkb('sig','SIGTAP (procedimento)')}<label>Observação / conduta<textarea id=f_obs rows=3>${e(o.obs)}</textarea></label>
 <div class=bt><button class=ok onclick="salvar('${id}','ok')">Terminar atendimento</button><button class=wn onclick="salvar('${id}','dep')">Preencher produtividade depois</button><button onclick="$('#md').style.display='none'">Fechar</button></div>`;['cid','ciap','sig'].forEach(chips);$('#md').style.display='block'}
function imc(){const p=+$('#f_peso').value,a=+$('#f_alt').value/100;$('#f_imc').value=p&&a?(p/a/a).toFixed(1):''}
async function salvar(id,fim){const g=k=>$('#f_'+k).value,pr={...S.pk};['vac','am','pc','peso','alt','imc','pa','ig','gp','pt','obs'].forEach(k=>pr[k]=g(k));if(await api('fim',{id,v:fim,prod:pr})){$('#md').style.display='none';load()}}
async function pushOn(){try{if(!FB.apiKey)return alert('Configure o Firebase no index.html.');const reg=await navigator.serviceWorker.ready;if(await Notification.requestPermission()!='granted')return alert('Permissão negada.');firebase.initializeApp(FB);const tk=await firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});if(await api('tok',{tk}))alert('Notificações ativadas neste aparelho.')}catch(x){alert(x.message)}}
let dp;addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();dp=ev;ins()});
function ins(){const b=$('#ins');if(!b)return;b.innerHTML=dp?`<button class=p onclick="dp.prompt()">Instalar aplicativo</button>`:/iPhone|iPad/.test(navigator.userAgent)?'<small>iPhone: toque em Compartilhar → Adicionar à Tela de Início.</small>':''}

const ld=s=>new Promise((ok,er)=>{const x=document.createElement('script');x.src=s;x.onload=ok;x.onerror=()=>er(new Error('Não foi possível carregar o leitor de texto. Verifique a internet.'));document.head.appendChild(x)});
function parse(tx){let med='',dia='';const out=[];tx.split('\n').forEach(l=>{const pf=l.match(/Profission\w*\W*(.+?)(?:\s+-\s*CRM|$)/i);if(pf&&!med){const nm=nz(pf[1]),s=S.d.staff.find(s=>nm.includes(nz(s.n)));if(s)med=s.id}
 const dc=l.match(/Data\s*Consulta\D*(\d{2})\/(\d{2})\/(\d{4})/i);if(dc)dia=`${dc[3]}-${dc[2]}-${dc[1]}`;
 const m=l.match(/^\W*\d{1,2}\s+(\d{1,2}[:.]\d{2})\s+(.*)$/);if(!m)return;const r=m[2].replace(/\d{2}\/\d{2}\/\d{4}.*$/,''),pr=(r.match(/\b\d{3,7}\b/g)||[]).pop()||'',nome=r.replace(/[^A-Za-zÀ-ÿ ]+/g,' ').replace(/\s+/g,' ').trim();
 if(nome.length>3)out.push({hora:m[1].replace('.',':').padStart(5,'0'),nome,pr,urg:r.includes('*')})});return{med,dia,out}}
async function lista_foto(inp){const fs=[...inp.files];if(!fs.length)return;if(fs.length>2){inp.value='';return alert('Envie no máximo 2 folhas por médico de cada vez.')}
 $('#mc').innerHTML='<h2>Lendo a lista…</h2><small id=pg>Preparando</small>';$('#md').style.display='block';
 try{if(!window.Tesseract)await ld('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');const it=[];let dia='';
  for(const[k,f]of fs.entries()){$('#pg').textContent=`Folha ${k+1} de ${fs.length}…`;const{data}=await Tesseract.recognize(f,'por'),r=parse(data.text);dia=dia||r.dia;r.out.forEach(o=>it.push({...o,med:r.med}))}
  S.imp={dia:dia||hoje(),it};revisar()}catch(x){alert(x.message);$('#md').style.display='none'}inp.value=''}
function revisar(){const{dia,it}=S.imp,ms=meds();$('#mc').innerHTML=`<h2>Conferir lista</h2><small>Corrija o que a leitura errou e desmarque o que não deve entrar.</small><label>Data da lista<input type=date id=ld value="${dia}"></label>`+(it.map((o,i)=>`<div class=card><label><input type=checkbox style="width:auto" id=ck${i} checked> Importar</label><div class=g2><input id=ih${i} type=time value="${o.hora}"><select id=im${i}><option value="">Médico?${ms.map(s=>`<option value=${s.id} ${s.id==o.med?'selected':''}>${e(s.n)}`).join('')}</select></div><input id=in${i} value="${e(o.nome)}"></div>`).join('')||'<small>Nenhum paciente encontrado. Tente outra foto, reta e com boa luz.</small>')+`<div class=bt>${it.length?'<button class=p onclick="importar()">Importar pacientes</button>':''}<button onclick="$('#md').style.display='none'">Fechar</button></div>`}
async function importar(){const dia=$('#ld').value,itens=[];let ok=1;S.imp.it.forEach((o,i)=>{if(!$('#ck'+i).checked)return;const med=$('#im'+i).value;if(!med)ok=0;itens.push({nome:$('#in'+i).value.trim(),med,hora:$('#ih'+i).value,dia,pr:o.pr,urg:o.urg})});
 if(!ok||!itens.length)return alert('Escolha o médico de todos os pacientes marcados.');const r=await api('import',{itens});if(r){$('#md').style.display='none';alert(r.n+' pacientes importados.');load()}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
paint(1);load();setInterval(load,20000);
</script></body></html>
